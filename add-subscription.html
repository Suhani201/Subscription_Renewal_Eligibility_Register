
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Subscription</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <aside class="sidebar">
        <h2>Subscription<br>Register</h2>
        <p class="subtitle">Renewal Management System</p>

        <nav>
            <a href="index.html">🏠 Dashboard</a>
            <a href="add-subscription.html" class="active">➕ Add Subscription</a>
            <a href="view-subscriptions.html">📋 View Subscriptions</a>
            <a href="eligibility.html">🔍 Check Eligibility</a>
        </nav>
    </aside>

    <main class="main-content">

        <header class="topbar">
            <h2>Add Subscription</h2>
            <div class="admin">Admin / Staff</div>
        </header>

        <section class="information">

            <h2>Enter Subscriber Details</h2>

            <p id="formMode">Add a new subscription.</p>
            <p>Fill in the subscription information below.</p>

            <form id="subscriptionForm">

                <label for="subscriberName">Subscriber Name</label>
                <input
                    type="text"
                    id="subscriberName"
                    placeholder="Enter subscriber name"
                    required
                >

                <label for="email">Email Address</label>
                <input
                    type="email"
                    id="email"
                    placeholder="Enter email address"
                    required
                >

                <label for="phone">Phone Number</label>
                <input
                    type="tel"
                    id="phone"
                    placeholder="Enter 10-digit phone number"
                    pattern="[0-9]{10}"
                    maxlength="10"
                    required
                >

                <label for="subscriptionType">Subscription Type</label>
                <select id="subscriptionType" required>
                    <option value="">Select subscription type</option>
                    <option value="Monthly">Monthly</option>
                    <option value="Quarterly">Quarterly</option>
                    <option value="Yearly">Yearly</option>
                </select>

                <label for="startDate">Start Date</label>
                <input type="date" id="startDate" required>

                <label for="expiryDate">Expiry Date</label>
                <input type="date" id="expiryDate" required>

                <label for="paymentStatus">Payment Status</label>
                <select id="paymentStatus" required>
                    <option value="">Select payment status</option>
                    <option value="Paid">Paid</option>
                    <option value="Unpaid">Unpaid</option>
                </select>

                <label for="currentStatus">Current Status</label>
                <select id="currentStatus" required>
                    <option value="">Select current status</option>
                    <option value="Active">Active</option>
                    <option value="Inactive">Inactive</option>
                </select>

                <div class="action-buttons">

                    <button type="submit" id="saveButton">
                        Save Subscription
                    </button>

                    <button type="reset" class="reset-btn">
                        Clear Form
                    </button>

                </div>

            </form>

        </section>

    </main>

</div>

<script src="script.js"></script>

</body>
</html>
